name: Deploy API to MonsterASP.NET

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-monsterasp-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Build, publish and deploy
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore SchoolManagment.slnx

      - name: Build
        run: dotnet build SchoolManagment.slnx --configuration Release --no-restore

      - name: Publish API
        run: >
          dotnet publish SchoolManagment.API/SchoolManagment.API.csproj
          --configuration Release
          --output "${{ github.workspace }}\publish"
          --runtime win-x86
          --self-contained false

      - name: Deploy via Web Deploy
        uses: rasmusbuchholdt/simply-web-deploy@2.2.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
          source-path: "\publish\"
