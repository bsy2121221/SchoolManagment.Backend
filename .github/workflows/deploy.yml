name: Deploy API to MonsterASP.NET

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-monsterasp-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: windows-latest
    env:
      FTP_REMOTE_DIR: ${{ secrets.FTP_SERVER_DIR || '/wwwroot/' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize FTP remote directory
        shell: pwsh
        run: |
          $dir = $env:FTP_REMOTE_DIR
          if ([string]::IsNullOrWhiteSpace($dir)) { $dir = "/wwwroot/" }
          $dir = "/" + ($dir.Trim() -replace "\\", "/" -replace "^/+", "").TrimEnd("/") + "/"
          "FTP_REMOTE_DIR=$dir" | Add-Content -Path $env:GITHUB_ENV
          Write-Host "FTP remote directory: $dir"

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore SchoolManagment.API/SchoolManagment.API.csproj --runtime win-x86

      - name: Publish for MonsterASP (win-x86)
        run: >
          dotnet publish SchoolManagment.API/SchoolManagment.API.csproj
          --configuration Release
          --runtime win-x86
          --self-contained false
          --no-restore
          --output ./publish
          -p:EnvironmentName=Production
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Remove local-only publish files
        shell: pwsh
        run: |
          Remove-Item ./publish/appsettings.Development.json -ErrorAction SilentlyContinue
          Remove-Item ./publish/*.pdb -ErrorAction SilentlyContinue
          if (-not (Test-Path ./publish/web.config)) {
            throw "publish/web.config is missing. IIS will not start the ASP.NET Core site."
          }
          Get-ChildItem ./publish | Select-Object Name, Length | Format-Table -AutoSize

      - name: Stage app_offline.htm
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./ftp-app-offline | Out-Null
          Copy-Item deploy/app_offline.htm ./ftp-app-offline/app_offline.htm

      - name: Stop site (upload app_offline.htm)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./ftp-app-offline/
          server-dir: ${{ env.FTP_REMOTE_DIR }}
          dangerous-clean-slate: false
          log-level: minimal
          timeout: 180000

      - name: Wait for IIS to release file locks
        shell: pwsh
        run: Start-Sleep -Seconds 20

      - name: Deploy to MonsterASP wwwroot
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./publish/
          server-dir: ${{ env.FTP_REMOTE_DIR }}
          dangerous-clean-slate: false
          log-level: standard
          timeout: 600000
          exclude: |
            **/*.pdb
            **/.ftp-deploy-sync-state.json
            **/appsettings.Development.json

      - name: Start site (remove app_offline.htm)
        shell: pwsh
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          $dir = $env:FTP_REMOTE_DIR.Trim().TrimEnd('/')
          $remotePath = "$dir/app_offline.htm"
          & ./deploy/ftp-remove-file.ps1 -Server $env:FTP_SERVER -Username $env:FTP_USERNAME -Password $env:FTP_PASSWORD -RemotePath $remotePath
